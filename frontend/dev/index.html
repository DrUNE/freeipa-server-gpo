<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GPUI dev harness</title>
<link rel="stylesheet" href="/ipa/ui/js/plugins/chain/css/main.css">
<link rel="stylesheet" href="/ipa/ui/js/plugins/chain/css/other.css">
<style>
    html, body { margin: 0; height: 100%; font: 12px Arial, sans-serif; background: #f4f4f4; }
    .dev-bar { display: flex; gap: 12px; align-items: center; padding: 6px 12px; background: #1f2a44; color: #fff; font: 13px/1.4 system-ui, sans-serif; }
    .dev-bar label { display: flex; gap: 6px; align-items: center; }
    .dev-bar input, .dev-bar select, .dev-bar button { font: inherit; padding: 2px 6px; }
    .dev-bar .spacer { flex: 1; }
    .dev-bar a { color: #9cf; }
    .dev-shell { height: calc(100% - 36px); display: flex; justify-content: center; background: #ddd; padding: 12px; box-sizing: border-box; }
    .modal-gpui .modal-content { width: 100%; max-width: 1400px; height: 100%; display: flex; flex-direction: column; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .modal-gpui .modal-header { padding: 8px 14px; border-bottom: 1px solid #ccc; font-weight: bold; }
    .modal-gpui .modal-body { flex: 1; min-height: 0; overflow: hidden; }
    #gp__container { height: 100%; }
    #dev-notify { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 20000; }
    .dev-notify__item { padding: 8px 12px; border-radius: 4px; background: #333; color: #fff; max-width: 420px; }
    .dev-notify__item--error { background: #b32424; }
    .dev-notify__item--success { background: #2e7d32; }
</style>
</head>
<body>
<div class="dev-bar">
    <strong>GPUI dev</strong>
    <label>GPO <input id="dev-gpo" size="24"></label>
    <label>Lang
        <select id="dev-lang"><option value="en">en</option><option value="ru">ru</option></select>
    </label>
    <button id="dev-reload" type="button">Reload editor</button>
    <button id="dev-reset" type="button" title="Drop in-memory fixture state on the server">Reset fixtures</button>
    <span class="spacer"></span>
    <a href="https://github.com/DrUNE/freeipa-server-gpo/tree/master/frontend/dev" target="_blank" rel="noopener">frontend/dev</a>
</div>
<div class="dev-shell">
    <div class="modal-gpui" role="dialog" aria-modal="true" aria-labelledby="gpo-shell-title">
        <div class="modal-content">
            <div class="modal-header"><h4 class="modal-title" id="gpo-shell-title"></h4></div>
            <div class="modal-body"><div id="gp__container" class="gp__container"></div></div>
        </div>
    </div>
</div>
<div id="dev-notify"></div>

<script type="module">
import * as app from '@gpui/app.js';
(function() {
    var params = new URLSearchParams(location.search);
    var gpoName = params.get('gpo') || 'Dev GPO';
    var lang = params.get('lang') || (navigator.language || 'en').slice(0, 2);

    document.getElementById('dev-gpo').value = gpoName;
    document.getElementById('dev-lang').value = lang === 'ru' ? 'ru' : 'en';
    document.getElementById('gpo-shell-title').textContent = 'GPUI | ' + gpoName;

    // app.init() derives the UI language from navigator.language.
    try {
        Object.defineProperty(navigator, 'language', { get: function() { return lang; }, configurable: true });
        Object.defineProperty(navigator, 'languages', { get: function() { return [lang, 'en-US']; }, configurable: true });
    } catch (_) { /* ignore */ }

    function navigate() {
        var next = new URLSearchParams();
        next.set('gpo', document.getElementById('dev-gpo').value || 'Dev GPO');
        next.set('lang', document.getElementById('dev-lang').value);
        location.search = next.toString();
    }
    document.getElementById('dev-reload').addEventListener('click', navigate);
    document.getElementById('dev-lang').addEventListener('change', navigate);
    document.getElementById('dev-gpo').addEventListener('keydown', function(event) { if (event.key === 'Enter') navigate(); });
    document.getElementById('dev-reset').addEventListener('click', function() {
        fetch('/__dev/reset', { method: 'POST' }).then(navigate);
    });

    window.gpui = app;
    app.init({ containerId: 'gp__container', policyName: gpoName, path: '/' });
})();
</script>
</body>
</html>
